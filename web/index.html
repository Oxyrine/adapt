    <!-- Makes the app installable (Android "Add to Home screen" / desktop Chrome install
         prompt): manifest + icons + a registered service worker (see main.tsx) is the full
         Chrome installability checklist. iOS Safari ignores the manifest for icons/theming,
         hence the separate apple-* tags below. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6750a4" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prof. Albert" />
  </head>
  <body>

    <script type="module" src="/src/main.tsx"></script>
  </body>
